<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="444" viewBox="0 0 1200 444" role="img" aria-labelledby="hero-title hero-desc" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif">
  <title id="hero-title">学习通作业爬取工具 · XXT Homework Fetcher</title>
  <desc id="hero-desc">macOS 原生工具：批量抓取超星学习通课程作业的题干、选项与答案，合并导出为一份排好版的 Word 文档。右侧为抓取结果生成的 Word 样张。</desc>

  <defs>
    <filter id="paper-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3A2E20" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- ===== canvas ===== -->
  <rect width="1200" height="444" rx="24" fill="#F6F2E9"/>
  <rect x="0.5" y="0.5" width="1199" height="443" rx="23.5" fill="none" stroke="#E6DDCB"/>

  <!-- ===== title block ===== -->
  <g id="title-block">
    <rect x="76" y="82" width="26" height="3" rx="1.5" fill="#C4382A"/>
    <text x="114" y="93" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="2.4" fill="#7C7467">XXT HOMEWORK FETCHER</text>

    <text x="76" y="182" font-size="61" font-weight="600" fill="#191A1E" letter-spacing="0.5">学习通作业爬取工具</text>

    <text x="76" y="238" font-size="21" fill="#4F4B45">把学习通课程里的作业题干、选项与答案</text>
    <text x="76" y="270" font-size="21" fill="#4F4B45">整批抓下来，合并成一份排好版的 Word。</text>

    <rect x="76" y="316" width="548" height="1" fill="#E2D9C8"/>
    <text x="76" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16.5" fill="#7C7467">macOS 14+ · SwiftUI 原生 · 内置引擎 · 全程本地 · MIT</text>
  </g>

  <!-- ===== document specimen ===== -->
  <g id="document-specimen">
    <!-- stacked page behind -->
    <rect x="708" y="60" width="430" height="336" rx="3" fill="#EBE3D4"/>

    <!-- front page -->
    <rect x="690" y="44" width="440" height="352" rx="3" fill="#FFFDF8" stroke="#E4DACA" filter="url(#paper-shadow)"/>

    <!-- page header -->
    <text x="714" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1.2" fill="#877E70">WORD · 合并文档</text>
    <text x="1106" y="80" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#877E70">共 19 题</text>
    <rect x="714" y="94" width="392" height="1" fill="#ECE4D5"/>

    <!-- question meta -->
    <text x="714" y="130" font-size="22" font-weight="600" fill="#191A1E">第 2 题</text>
    <text x="1106" y="130" text-anchor="end" font-size="18" fill="#877E70">单选题</text>

    <!-- question -->
    <text x="714" y="168" font-size="20.5" fill="#33302B">在哈希表查找过程中，</text>
    <text x="714" y="196" font-size="20.5" fill="#33302B">可用（　）来处理冲突。</text>

    <!-- options -->
    <g font-size="21" fill="#33302B">
      <text x="714" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8C8273">A</text>
      <text x="742" y="236">关键字比较法</text>

      <rect x="706" y="246" width="3" height="26" rx="1.5" fill="#C4382A"/>
      <text x="714" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#C4382A">B</text>
      <text x="742" y="266" font-weight="600" fill="#191A1E">线性探测法</text>
      <path d="M880 242 L880 268 L886.5 261.5 L890.5 270 L894 268.5 L890.5 260 L899 260 Z" fill="#C4382A" stroke="#FFFDF8" stroke-width="1.6" stroke-linejoin="round"/>

      <text x="714" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8C8273">C</text>
      <text x="742" y="296">除留余数法</text>

      <text x="714" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8C8273">D</text>
      <text x="742" y="326">数字分析法</text>
    </g>

    <!-- answer -->
    <rect x="706" y="344" width="408" height="1" fill="#EADFCE"/>
    <text x="714" y="376" font-size="21" fill="#C4382A"><tspan font-weight="600">答案</tspan>　B　线性探测法</text>
  </g>
</svg>
