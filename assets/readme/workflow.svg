<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="392" viewBox="0 0 1200 392" role="img" aria-labelledby="wf-title wf-desc" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif">
  <title id="wf-title">从课程到 Word 的五步流程与运行架构</title>
  <desc id="wf-desc">五步流程：选择课程、扫码登录、并发抓取、合并排版、导出文档。运行架构：SwiftUI 原生界面经本地 bridge 调用自包含 Python + Playwright 引擎，由导出器生成 Word / PDF，全程在本机完成。</desc>

  <rect width="1200" height="392" rx="24" fill="#F6F2E9"/>
  <rect x="0.5" y="0.5" width="1199" height="391" rx="23.5" fill="none" stroke="#E6DDCB"/>

  <!-- header -->
  <g>
    <rect x="76" y="58" width="26" height="3" rx="1.5" fill="#C4382A"/>
    <text x="114" y="69" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="2.4" fill="#7C7467">PIPELINE</text>
    <text x="1124" y="69" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#7C7467">全程本机 · 无上传</text>
  </g>

  <!-- ===== five steps ===== -->
  <g id="steps">
    <!-- step 1 -->
    <g>
      <text x="76" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#C4382A">01</text>
      <text x="112" y="154" font-size="26" font-weight="600" fill="#191A1E">选择课程</text>
      <text x="76" y="190" font-size="18" fill="#6F685C">账号课程下拉加载</text>
      <text x="76" y="214" font-size="18" fill="#6F685C">URL 作兜底</text>
    </g>
    <!-- step 2 -->
    <g>
      <text x="292" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#C4382A">02</text>
      <text x="328" y="154" font-size="26" font-weight="600" fill="#191A1E">扫码登录</text>
      <text x="292" y="190" font-size="18" fill="#6F685C">一次扫码</text>
      <text x="292" y="214" font-size="18" fill="#6F685C">登录态加密复用</text>
    </g>
    <!-- step 3 -->
    <g>
      <text x="508" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#C4382A">03</text>
      <text x="544" y="154" font-size="26" font-weight="600" fill="#191A1E">并发抓取</text>
      <text x="508" y="190" font-size="18" fill="#6F685C">题干 · 选项 · 答案 · 图片</text>
      <text x="508" y="214" font-size="18" fill="#6F685C">多线程并发翻页</text>
    </g>
    <!-- step 4 -->
    <g>
      <text x="724" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#C4382A">04</text>
      <text x="760" y="154" font-size="26" font-weight="600" fill="#191A1E">合并排版</text>
      <text x="724" y="190" font-size="18" fill="#6F685C">合成一份 Word</text>
      <text x="724" y="214" font-size="18" fill="#6F685C">自动过滤统计页</text>
    </g>
    <!-- step 5 -->
    <g>
      <text x="940" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#C4382A">05</text>
      <text x="976" y="154" font-size="26" font-weight="600" fill="#191A1E">导出文档</text>
      <text x="940" y="190" font-size="18" fill="#6F685C">Word / PDF / Markdown</text>
      <text x="940" y="214" font-size="18" fill="#6F685C">保存到本地目录</text>
    </g>

    <!-- flow arrows in the gaps -->
    <g stroke="#B3A996" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M270 146 H284 M279 141.5 L284 146 L279 150.5"/>
      <path d="M486 146 H500 M495 141.5 L500 146 L495 150.5"/>
      <path d="M702 146 H716 M711 141.5 L716 146 L711 150.5"/>
      <path d="M918 146 H932 M927 141.5 L932 146 L927 150.5"/>
    </g>
  </g>

  <!-- ===== runtime architecture ===== -->
  <g id="runtime">
    <rect x="76" y="262" width="1048" height="1" fill="#DCD2C0"/>
    <text x="76" y="297" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1.8" fill="#7C7467">运行架构</text>

    <g font-size="21" fill="#191A1E">
      <text x="76" y="342">SwiftUI 原生界面</text>
      <path d="M276 335 H300 M292 330.5 L300 335 L292 339.5" stroke="#B3A996" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="316" y="342">Python + Playwright 引擎</text>
      <path d="M576 335 H600 M592 330.5 L600 335 L592 339.5" stroke="#B3A996" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="616" y="342">导出器</text>
      <path d="M696 335 H720 M712 330.5 L720 335 L712 339.5" stroke="#B3A996" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="736" y="342">Word / PDF / Markdown</text>
    </g>
  </g>
</svg>
