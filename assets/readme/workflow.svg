<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="448" viewBox="0 0 1200 448" role="img" aria-labelledby="wf-title wf-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="wf-title">端到端抓取流程与运行架构</title>
  <desc id="wf-desc">选择课程 → 扫码登录 → 批量抓取（题目/选项/答案/图片）→ 自动合并 → 导出 Word/PDF；上层为 SwiftUI 原生界面，经 bridge 调用自包含 Python + Playwright 引擎，由导出器生成文档。</desc>

  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="448" rx="26" fill="#0A0C12"/>
  <rect x="0.75" y="0.75" width="1198.5" height="446.5" rx="25" fill="none" stroke="#212942" stroke-width="1.5"/>

  <text x="42" y="40" font-size="18" fill="#8B93A7" letter-spacing="1.5">端到端抓取流程</text>

  <!-- ============ stage cards ============ -->
  <!-- card 1 -->
  <g transform="translate(42 58)">
    <rect width="196" height="150" rx="16" fill="#10131E" stroke="#232B40" stroke-width="1.5"/>
    <rect x="16" y="16" width="28" height="28" rx="9" fill="#1A2140" stroke="#4F46E5" stroke-width="1.4"/>
    <text x="30" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#22D3EE">1</text>
    <g transform="translate(132 16)" stroke="#22D3EE" stroke-width="2.4" fill="none" stroke-linecap="round">
      <rect x="0" y="2" width="40" height="36" rx="7"/>
      <line x1="9" y1="13" x2="28" y2="13"/>
      <line x1="9" y1="21" x2="28" y2="21"/>
      <line x1="9" y1="29" x2="21" y2="29"/>
    </g>
    <text x="16" y="82" font-size="22" font-weight="700" fill="#EEF1F7">选择课程</text>
    <text x="16" y="108" font-size="16" fill="#97A0B4">账号课程下拉选择</text>
    <text x="16" y="130" font-size="16" fill="#97A0B4">URL 输入作兜底</text>
  </g>

  <!-- card 2 -->
  <g transform="translate(272 58)">
    <rect width="196" height="150" rx="16" fill="#10131E" stroke="#232B40" stroke-width="1.5"/>
    <rect x="16" y="16" width="28" height="28" rx="9" fill="#1A2140" stroke="#4F46E5" stroke-width="1.4"/>
    <text x="30" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#22D3EE">2</text>
    <g transform="translate(132 16)">
      <rect x="2" y="2" width="40" height="40" rx="7" fill="none" stroke="#22D3EE" stroke-width="2.4"/>
      <rect x="9" y="9" width="11" height="11" rx="2" fill="#4F46E5"/>
      <rect x="24" y="9" width="11" height="11" rx="2" fill="#4F46E5"/>
      <rect x="9" y="24" width="11" height="11" rx="2" fill="#4F46E5"/>
      <rect x="26" y="26" width="4" height="4" fill="#22D3EE"/>
      <rect x="32" y="30" width="4" height="4" fill="#22D3EE"/>
    </g>
    <text x="16" y="82" font-size="22" font-weight="700" fill="#EEF1F7">扫码登录</text>
    <text x="16" y="108" font-size="16" fill="#97A0B4">学习通 App 扫码</text>
    <text x="16" y="130" font-size="16" fill="#97A0B4">登录态加密复用</text>
  </g>

  <!-- card 3 -->
  <g transform="translate(502 58)">
    <rect width="196" height="150" rx="16" fill="#10131E" stroke="#232B40" stroke-width="1.5"/>
    <rect x="16" y="16" width="28" height="28" rx="9" fill="#1A2140" stroke="#4F46E5" stroke-width="1.4"/>
    <text x="30" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#22D3EE">3</text>
    <g transform="translate(132 16)">
      <rect x="4" y="2" width="26" height="36" rx="5" fill="none" stroke="#22D3EE" stroke-width="2.4"/>
      <line x1="10" y1="12" x2="24" y2="12" stroke="#4F46E5" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="10" y1="20" x2="24" y2="20" stroke="#4F46E5" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M27 22 l11 11 l-4 3 l-3 7 l-3 -1 l3 -7 l-4 1 z" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.6"/>
    </g>
    <text x="16" y="82" font-size="22" font-weight="700" fill="#EEF1F7">批量抓取</text>
    <text x="16" y="108" font-size="16" fill="#97A0B4">多线程并发翻页</text>
    <text x="16" y="130" font-size="16" fill="#97A0B4">题目·答案·图片</text>
  </g>

  <!-- card 4 -->
  <g transform="translate(732 58)">
    <rect width="196" height="150" rx="16" fill="#10131E" stroke="#232B40" stroke-width="1.5"/>
    <rect x="16" y="16" width="28" height="28" rx="9" fill="#1A2140" stroke="#4F46E5" stroke-width="1.4"/>
    <text x="30" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#22D3EE">4</text>
    <g transform="translate(132 16)">
      <rect x="2" y="6" width="20" height="28" rx="4" fill="none" stroke="#22D3EE" stroke-width="2.2"/>
      <rect x="16" y="12" width="20" height="28" rx="4" fill="#10131E" stroke="#4F46E5" stroke-width="2.2"/>
    </g>
    <text x="16" y="82" font-size="22" font-weight="700" fill="#EEF1F7">自动合并</text>
    <text x="16" y="108" font-size="16" fill="#97A0B4">本次作业自动合并</text>
    <text x="16" y="130" font-size="16" fill="#97A0B4">生成单个 Word</text>
  </g>

  <!-- card 5 -->
  <g transform="translate(962 58)">
    <rect width="196" height="150" rx="16" fill="#10131E" stroke="#232B40" stroke-width="1.5"/>
    <rect x="16" y="16" width="28" height="28" rx="9" fill="#1A2140" stroke="#4F46E5" stroke-width="1.4"/>
    <text x="30" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#22D3EE">5</text>
    <g transform="translate(132 16)">
      <path d="M8 2 h18 l8 8 v28 a4 4 0 0 1 -4 4 h-22 a4 4 0 0 1 -4 -4 v-32 a4 4 0 0 1 4 -4 z" fill="none" stroke="#22D3EE" stroke-width="2.2"/>
      <path d="M20 16 v14 m-5 -5 l5 6 l5 -6" stroke="#4F46E5" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="16" y="82" font-size="22" font-weight="700" fill="#EEF1F7">导出文档</text>
    <text x="16" y="108" font-size="16" fill="#97A0B4">导出 Word / PDF</text>
    <text x="16" y="130" font-size="16" fill="#97A0B4">保存到本地目录</text>
  </g>

  <!-- connectors -->
  <g stroke="url(#flow)" stroke-width="2.6" fill="url(#flow)" stroke-linecap="round">
    <path d="M242 133 H260"/><path d="M260 128 l9 5 l-9 5 z" stroke="none"/>
    <path d="M472 133 H490"/><path d="M490 128 l9 5 l-9 5 z" stroke="none"/>
    <path d="M702 133 H720"/><path d="M720 128 l9 5 l-9 5 z" stroke="none"/>
    <path d="M932 133 H950"/><path d="M950 128 l9 5 l-9 5 z" stroke="none"/>
  </g>

  <!-- annotation pills -->
  <g>
    <g transform="translate(42 226)">
      <rect width="316" height="34" rx="17" fill="#0E1420" stroke="#23304A" stroke-width="1.3"/>
      <circle cx="20" cy="17" r="4" fill="#22D3EE"/>
      <text x="34" y="22" font-size="16" fill="#AEB6C6">抓取中可继续勾选，动态追加进队列</text>
    </g>
    <g transform="translate(370 226)">
      <rect width="252" height="34" rx="17" fill="#0E1420" stroke="#23304A" stroke-width="1.3"/>
      <circle cx="20" cy="17" r="4" fill="#22D3EE"/>
      <text x="34" y="22" font-size="16" fill="#AEB6C6">断点续传 · 失败自动重试</text>
    </g>
    <g transform="translate(634 226)">
      <rect width="272" height="34" rx="17" fill="#0E1420" stroke="#23304A" stroke-width="1.3"/>
      <circle cx="20" cy="17" r="4" fill="#22D3EE"/>
      <text x="34" y="22" font-size="16" fill="#AEB6C6">自动过滤「智能分析」统计页</text>
    </g>
  </g>

  <!-- ============ architecture band ============ -->
  <g>
    <rect x="42" y="290" width="1116" height="132" rx="18" fill="#0C0F18" stroke="#1C2438" stroke-width="1.5"/>
    <text x="66" y="316" font-size="16" fill="#6B7488" letter-spacing="1.5">运行架构</text>

    <!-- box A -->
    <g transform="translate(118 330)">
      <rect width="272" height="78" rx="12" fill="#141826" stroke="#2A3350" stroke-width="1.4"/>
      <rect width="4" height="78" rx="2" fill="url(#flow)"/>
      <text x="22" y="34" font-size="19" font-weight="700" fill="#EEF1F7">SwiftUI 原生界面</text>
      <text x="22" y="58" font-size="15" fill="#8B93A7">macOS 单页任务流</text>
    </g>
    <!-- box B -->
    <g transform="translate(464 330)">
      <rect width="272" height="78" rx="12" fill="#141826" stroke="#2A3350" stroke-width="1.4"/>
      <rect width="4" height="78" rx="2" fill="url(#flow)"/>
      <text x="22" y="34" font-size="19" font-weight="700" fill="#EEF1F7">自包含 Python 引擎</text>
      <text x="22" y="58" font-size="15" fill="#8B93A7">Playwright · 多线程并发</text>
    </g>
    <!-- box C -->
    <g transform="translate(810 330)">
      <rect width="272" height="78" rx="12" fill="#141826" stroke="#2A3350" stroke-width="1.4"/>
      <rect width="4" height="78" rx="2" fill="url(#flow)"/>
      <text x="22" y="34" font-size="19" font-weight="700" fill="#EEF1F7">导出器</text>
      <text x="22" y="58" font-size="15" fill="#8B93A7">docx · docxcompose · PDF</text>
    </g>

    <!-- inline connectors: line — label — line ▸ (labels centered on the line) -->
    <g stroke="url(#flow)" stroke-width="2.6" fill="url(#flow)" stroke-linecap="round">
      <path d="M392 369 H406"/>
      <path d="M448 369 H455"/><path d="M455 364 l8 5 l-8 5 z" stroke="none"/>
      <path d="M738 369 H752"/>
      <path d="M794 369 H801"/><path d="M801 364 l8 5 l-8 5 z" stroke="none"/>
    </g>
    <g font-size="12" fill="#7C86A0" text-anchor="middle">
      <text x="427" y="373">bridge</text>
      <text x="773" y="373">export</text>
    </g>
  </g>
</svg>
